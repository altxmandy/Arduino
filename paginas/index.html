<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AILux - Projeto integrador</title>

    <link rel="stylesheet" href="../estilo/estilo.css">
</head>

<body>

    <header>
        <div class="logo"></div>
        <h1>AILux - Projeto integrador</h1>
    </header>

    <nav>
        <a href="sobre.html">Sobre Projeto</a>
        <a href="index.html" class="pagina-atual">Página Inicial</a>
        <a href="equipe.html">Equipe</a>
    </nav>

    <main>
        <section class="painel">

            <div class="titulo">
                <h2>Dados de intensidade luminosa</h2>
                <p>Leitura atual do LDR conectado ao Arduino:</p>
            </div>

            <div class="cartoes">

                <article class="cartao">
                    <h3>Tensão no LDR</h3>
                    <p><strong id="tensao">--</strong> V</p>
                </article>

                <article class="cartao">
                    <h3>Lux Mínimo Estimado</h3>
                    <p><strong id="luxMin">--</strong> Lux</p>
                </article>

                <article class="cartao">
                    <h3>Lux Máximo Estimado</h3>
                    <p><strong id="luxMax">--</strong> Lux</p>
                </article>

            </div>

            <footer>
                <p class="status-titulo">Status da conexão</p>
                <p id="status">Verificando conexão...</p>
            </footer>

        </section>
    </main>

    <script src="../js/script.js"></script>
